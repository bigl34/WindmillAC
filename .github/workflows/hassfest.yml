name: Validate with hassfest

permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      # This fork's suite needs pytest + pytest-homeassistant-custom-component,
      # so it cannot run under upstream's dependency-free `unittest discover`.
      # `uv run --frozen pytest` is the fork's canonical validation command.
      - name: Install uv
        run: pip install uv
      - name: Run tests
        run: uv run --frozen pytest
      - uses: "home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb"
